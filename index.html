<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (typeof Promise.withResolvers !== 'function') {
        Promise.withResolvers = function () {
          var resolve, reject;
          var promise = new Promise(function (res, rej) {
            resolve = res;
            reject = rej;
          });
          return { promise: promise, resolve: resolve, reject: reject };
        };
      }
    </script>
    <title>GraderLabs — AI-Driven Exam Evaluation SaaS</title>
    <meta
      name="description"
      content="GraderLabs is an intelligent exam evaluation studio powered by multi-modal vision LLMs for OMR sheets, handwritten scripts, and rubric-aligned student reports."
    />
    <meta property="og:title" content="GraderLabs — AI-Driven Exam Evaluation SaaS" />
    <meta
      property="og:description"
      content="Evaluate OMR sheets, handwritten scripts, and complex rubrics with precision annotations and a themed Student Report Studio."
    />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
